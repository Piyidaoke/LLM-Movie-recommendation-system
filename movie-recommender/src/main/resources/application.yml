server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/movie_recommender?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: REDACTED
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: REDACTED
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
      embedding:
        enabled: false

    vectorstore:
      redis:
        initialize-schema: true
        index-name: movie_vector_index
        prefix: "movie_vector:"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.movierecommender.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: REDACTED
    expiration-ms: 86400000
  tmdb:
    api-key: REDACTED
    base-url: https://api.themoviedb.org/3
  embedding:
    api-key: REDACTED
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: text-embedding-v3
